{
  "name": "Verify unchanged Minoyama through production FTPS",
  "on": {"workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "legacy-publication", "cancel-in-progress": false},
  "jobs": {
    "verify": {
      "if": "github.ref == 'refs/heads/master'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "environment": {"name": "legacy-publish"},
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {"ref": "${{ github.sha }}", "persist-credentials": false, "fetch-depth": 1}
        },
        {
          "name": "Verify fixed public bytes and authenticated FTPS no-op",
          "env": {
            "EXPECTED_HEAD": "${{ github.sha }}",
            "GT030_PUBLISH_ENVIRONMENT": "legacy-publish",
            "SAKURA_FTPS_PASSWORD": "${{ secrets.SAKURA_FTPS_PASSWORD }}",
            "PYTHONDONTWRITEBYTECODE": "1"
          },
          "run": "python3 -B scripts/legacy_verify_unchanged.py --expected-head \"$EXPECTED_HEAD\" --report \"$RUNNER_TEMP/legacy-unchanged/report.json\""
        },
        {
          "name": "Retain hash-bound verification counts only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "legacy-unchanged-verification-${{ github.run_id }}",
            "path": "${{ runner.temp }}/legacy-unchanged/report.json",
            "if-no-files-found": "error",
            "retention-days": 1
          }
        }
      ]
    }
  }
}
